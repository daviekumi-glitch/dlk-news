name: CI

# Runs on every pull request (the primary gate) and on pushes to main so a
# direct push cannot bypass verification.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer commit on the same ref cancels the in-flight run - no point verifying
# code that has already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # package-lock.json is committed, so the cache key is derived from it
          # and a lockfile change invalidates the cache automatically.
          cache: npm

      # `npm ci` is the correct install: reproducible, and it fails loudly when
      # the manifest and the lockfile disagree. The lockfile is committed, so
      # this is the strict path - there is no fallback.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build static export
        run: npm run build

      # The webServer block in playwright.config.ts serves out/. The signed-in
      # spec self-skips (and reports as skipped) without E2E_ACCESS_TOKEN.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
