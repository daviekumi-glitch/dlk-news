# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# Deliberately conservative. A release build for a wrapper app does not need a
# large heap, and staying low keeps the build working on small CI runners and
# containers. Raise it if you add heavy native dependencies.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Build behaviour
# ---------------------------------------------------------------------------
# A daemon per build costs memory that a one-shot CI build never gets back.
org.gradle.daemon=false

# No parallel project execution or configuration cache: this project has a
# handful of modules and the wins do not justify the extra memory.
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Non-transitive R classes keep the resource table smaller.
android.nonTransitiveRClass=true
